<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <linearGradient
      id="madeira"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#b87a3c"
      />

      <stop
        offset="0.5"
        stop-color="#87512a"
      />

      <stop
        offset="1"
        stop-color="#54301d"
      />
    </linearGradient>

    <linearGradient
      id="madeira-clara"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#cf9652"
      />

      <stop
        offset="1"
        stop-color="#7d4725"
      />
    </linearGradient>

    <filter
      id="sombra"
      x="-25%"
      y="-25%"
      width="150%"
      height="150%"
    >
      <feDropShadow
        dx="10"
        dy="15"
        stdDeviation="11"
        flood-color="#000000"
        flood-opacity="0.5"
      />
    </filter>

    <filter
      id="textura"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.025"
        numOctaves="3"
        seed="9"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="ruido-cinza"
      />

      <feComponentTransfer
        in="ruido-cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.18"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>
  </defs>

  <g filter="url(#sombra)">
    <rect
      x="57"
      y="76"
      width="398"
      height="360"
      rx="15"
      fill="#28180f"
      opacity="0.75"
    />

    <g
