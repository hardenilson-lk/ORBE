<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <filter
      id="sombra"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="12"
        dy="16"
        stdDeviation="13"
        flood-color="#000000"
        flood-opacity="0.55"
      />
    </filter>

    <filter
      id="textura"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.025"
        numOctaves="3"
        seed="11"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="ruido-cinza"
      />

      <feComponentTransfer
        in="ruido-cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.16"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>

    <linearGradient
      id="metal"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#858982"
      />

      <stop
        offset="0.48"
        stop-color="#444944"
      />

      <stop
        offset="1"
        stop-color="#262a28"
      />
    </linearGradient>

    <linearGradient
      id="metal-claro"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#b9bdb4"
      />

      <stop
        offset="1"
        stop-color="#5d625d"
      />
    </linearGradient>

    <linearGradient
      id="madeira"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#bd8042"
      />

      <stop
        offset="0.5"
        stop-color="#824b27"
      />

      <stop
        offset="1"
        stop-color="#4e2c1b"
      />
    </linearGradient>

    <linearGradient
      id="amarelo"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#f3c84f"
      />

      <stop
        offset="0.55"
        stop-color="#c98d18"
      />

      <stop
        offset="1"
        stop-color="#76500c"
      />
    </linearGradient>

    <linearGradient
      id="vermelho"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#ef5448"
      />

      <stop
        offset="0.55"
        stop-color="#aa211e"
      />

      <stop
        offset="1"
        stop-color="#5a1110"
      />
    </linearGradient>
  </defs>

  <rect
    width="512"
    height="512"
    fill="transparent"
  />

  <g filter="url(#sombra)">
    
      <rect
        x="108"
        y="91"
        width="270"
        height="330"
        rx="45"
        fill="#171917"
        opacity="0.9"
      />

      <rect
        x="130"
        y="111"
        width="226"
        height="286"
        rx="35"
        fill="url(#amarelo)"
        stroke="#4d340c"
        stroke-width="14"
        filter="url(#textura)"
      />

      <rect
        x="165"
        y="150"
        width="156"
        height="110"
        rx="22"
        fill="#253237"
        stroke="#111719"
        stroke-width="12"
      />

      <path
        d="M181 236 L305 169"
        stroke="#6f8790"
        stroke-width="10"
        opacity="0.7"
      />

      <rect
        x="173"
        y="282"
        width="140"
        height="74"
        rx="18"
        fill="#76500d"
        stroke="#3f2b09"
        stroke-width="10"
      />

      <g
        fill="#171917"
        stroke="#343834"
        stroke-width="6"
      >
        <circle
          cx="135"
          cy="146"
          r="41"
        />

        <circle
          cx="351"
          cy="146"
          r="41"
        />

        <circle
          cx="135"
          cy="364"
          r="41"
        />

        <circle
          cx="351"
          cy="364"
          r="41"
        />
      </g>

      <g
        fill="url(#metal)"
        stroke="#171a18"
        stroke-width="9"
      >
        <rect
          x="200"
          y="48"
          width="25"
          height="102"
          rx="6"
        />

        <rect
          x="268"
          y="48"
          width="25"
          height="102"
          rx="6"
        />

        <rect
          x="197"
          y="38"
          width="101"
          height="26"
          rx="7"
        />

        <rect
          x="189"
          y="20"
          width="20"
          height="110"
          rx="5"
        />

        <rect
          x="285"
          y="20"
          width="20"
          height="110"
          rx="5"
        />
      </g>

      <circle
        cx="243"
        cy="319"
        r="25"
        fill="#272b28"
        stroke="#111311"
        stroke-width="8"
      />
    
  </g>
</svg>
