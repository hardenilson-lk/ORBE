<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <filter
      id="sombra"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="12"
        dy="16"
        stdDeviation="13"
        flood-color="#000000"
        flood-opacity="0.55"
      />
    </filter>

    <filter
      id="textura"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.025"
        numOctaves="3"
        seed="11"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="ruido-cinza"
      />

      <feComponentTransfer
        in="ruido-cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.16"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>

    <linearGradient
      id="metal"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#858982"
      />

      <stop
        offset="0.48"
        stop-color="#444944"
      />

      <stop
        offset="1"
        stop-color="#262a28"
      />
    </linearGradient>

    <linearGradient
      id="metal-claro"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#b9bdb4"
      />

      <stop
        offset="1"
        stop-color="#5d625d"
      />
    </linearGradient>

    <linearGradient
      id="madeira"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#bd8042"
      />

      <stop
        offset="0.5"
        stop-color="#824b27"
      />

      <stop
        offset="1"
        stop-color="#4e2c1b"
      />
    </linearGradient>

    <linearGradient
      id="amarelo"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#f3c84f"
      />

      <stop
        offset="0.55"
        stop-color="#c98d18"
      />

      <stop
        offset="1"
        stop-color="#76500c"
      />
    </linearGradient>

    <linearGradient
      id="vermelho"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#ef5448"
      />

      <stop
        offset="0.55"
        stop-color="#aa211e"
      />

      <stop
        offset="1"
        stop-color="#5a1110"
      />
    </linearGradient>
  </defs>

  <rect
    width="512"
    height="512"
    fill="transparent"
  />

  <g filter="url(#sombra)">
    
      <rect
        x="81"
        y="111"
        width="350"
        height="277"
        rx="24"
        fill="#171a18"
        opacity="0.85"
      />

      <rect
        x="101"
        y="131"
        width="310"
        height="237"
        rx="17"
        fill="url(#metal-claro)"
        stroke="#252a27"
        stroke-width="14"
        filter="url(#textura)"
      />

      <g
        stroke="#3d433f"
        stroke-width="12"
      >
        <line
          x1="135"
          y1="171"
          x2="377"
          y2="171"
        />

        <line
          x1="135"
          y1="242"
          x2="377"
          y2="242"
        />

        <line
          x1="135"
          y1="313"
          x2="377"
          y2="313"
        />
      </g>

      <path
        d="M105 135 C41 105 37 55 62 31"
        fill="none"
        stroke="#373d39"
        stroke-width="24"
        stroke-linecap="round"
      />

      <path
        d="M407 135 C471 105 475 55 450 31"
        fill="none"
        stroke="#373d39"
        stroke-width="24"
        stroke-linecap="round"
      />

      <g
        fill="#151715"
        stroke="#555b56"
        stroke-width="7"
      >
        <circle
          cx="113"
          cy="410"
          r="38"
        />

        <circle
          cx="399"
          cy="410"
          r="38"
        />
      </g>
    
  </g>
</svg>
