<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <linearGradient
      id="madeira-base"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#a26b35"
      />

      <stop
        offset="0.48"
        stop-color="#7e4e28"
      />

      <stop
        offset="1"
        stop-color="#59341f"
      />
    </linearGradient>

    <linearGradient
      id="madeira-clara"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#c58a4d"
      />

      <stop
        offset="1"
        stop-color="#7f4b27"
      />
    </linearGradient>

    <linearGradient
      id="metal"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#696963"
      />

      <stop
        offset="0.5"
        stop-color="#30302d"
      />

      <stop
        offset="1"
        stop-color="#818079"
      />
    </linearGradient>

    <filter
      id="sombra"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="12"
        dy="16"
        stdDeviation="13"
        flood-color="#000000"
        flood-opacity="0.55"
      />
    </filter>

    <filter
      id="textura"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.018"
        numOctaves="3"
        seed="14"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="ruido-cinza"
      />

      <feComponentTransfer
        in="ruido-cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.22"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>
  </defs>

  <g filter="url(#sombra)">
    <rect
      x="55"
