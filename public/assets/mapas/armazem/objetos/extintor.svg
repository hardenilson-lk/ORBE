<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <filter
      id="sombra"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="12"
        dy="16"
        stdDeviation="13"
        flood-color="#000000"
        flood-opacity="0.55"
      />
    </filter>

    <filter
      id="textura"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.025"
        numOctaves="3"
        seed="11"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="ruido-cinza"
      />

      <feComponentTransfer
        in="ruido-cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.16"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>

    <linearGradient
      id="metal"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#858982"
      />

      <stop
        offset="0.48"
        stop-color="#444944"
      />

      <stop
        offset="1"
        stop-color="#262a28"
      />
    </linearGradient>

    <linearGradient
      id="metal-claro"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#b9bdb4"
      />

      <stop
        offset="1"
        stop-color="#5d625d"
      />
    </linearGradient>

    <linearGradient
      id="madeira"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#bd8042"
      />

      <stop
        offset="0.5"
        stop-color="#824b27"
      />

      <stop
        offset="1"
        stop-color="#4e2c1b"
      />
    </linearGradient>

    <linearGradient
      id="amarelo"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#f3c84f"
      />

      <stop
        offset="0.55"
        stop-color="#c98d18"
      />

      <stop
        offset="1"
        stop-color="#76500c"
      />
    </linearGradient>

    <linearGradient
      id="vermelho"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#ef5448"
      />

      <stop
        offset="0.55"
        stop-color="#aa211e"
      />

      <stop
        offset="1"
        stop-color="#5a1110"
      />
    </linearGradient>
  </defs>

  <rect
    width="512"
    height="512"
    fill="transparent"
  />

  <g filter="url(#sombra)">
    
      <ellipse
        cx="256"
        cy="267"
        rx="120"
        ry="173"
        fill="#310b0b"
        opacity="0.85"
      />

      <ellipse
        cx="256"
        cy="258"
        rx="102"
        ry="156"
        fill="url(#vermelho)"
        stroke="#591111"
        stroke-width="16"
        filter="url(#textura)"
      />

      <ellipse
        cx="256"
        cy="133"
        rx="59"
        ry="39"
        fill="#d34139"
        stroke="#661613"
        stroke-width="12"
      />

      <rect
        x="221"
        y="70"
        width="70"
        height="72"
        rx="18"
        fill="url(#metal)"
        stroke="#181b19"
        stroke-width="10"
      />

      <path
        d="M286 96 C360 75 410 117 414 183"
        fill="none"
        stroke="#20231f"
        stroke-width="21"
        stroke-linecap="round"
      />

      <rect
        x="200"
        y="236"
        width="112"
        height="75"
        rx="9"
        fill="#ded8be"
        stroke="#6d681f"
        stroke-width="7"
      />

      <path
        d="M218 258 H294 M218 279 H278"
        stroke="#a72520"
        stroke-width="9"
      />

      <circle
        cx="255"
        cy="116"
        r="17"
        fill="#e8e4ce"
        stroke="#252923"
        stroke-width="7"
      />
    
  </g>
</svg>
