<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <filter
      id="sombra"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="12"
        dy="16"
        stdDeviation="13"
        flood-color="#000000"
        flood-opacity="0.55"
      />
    </filter>

    <filter
      id="textura"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.025"
        numOctaves="3"
        seed="11"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="ruido-cinza"
      />

      <feComponentTransfer
        in="ruido-cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.16"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>

    <linearGradient
      id="metal"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#858982"
      />

      <stop
        offset="0.48"
        stop-color="#444944"
      />

      <stop
        offset="1"
        stop-color="#262a28"
      />
    </linearGradient>

    <linearGradient
      id="metal-claro"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#b9bdb4"
      />

      <stop
        offset="1"
        stop-color="#5d625d"
      />
    </linearGradient>

    <linearGradient
      id="madeira"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#bd8042"
      />

      <stop
        offset="0.5"
        stop-color="#824b27"
      />

      <stop
        offset="1"
        stop-color="#4e2c1b"
      />
    </linearGradient>

    <linearGradient
      id="amarelo"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#f3c84f"
      />

      <stop
        offset="0.55"
        stop-color="#c98d18"
      />

      <stop
        offset="1"
        stop-color="#76500c"
      />
    </linearGradient>

    <linearGradient
      id="vermelho"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#ef5448"
      />

      <stop
        offset="0.55"
        stop-color="#aa211e"
      />

      <stop
        offset="1"
        stop-color="#5a1110"
      />
    </linearGradient>
  </defs>

  <rect
    width="512"
    height="512"
    fill="transparent"
  />

  <g filter="url(#sombra)">
    
      <rect
        x="85"
        y="48"
        width="342"
        height="416"
        rx="22"
        fill="#181b1a"
        opacity="0.9"
      />

      <rect
        x="101"
        y="65"
        width="310"
        height="382"
        rx="14"
        fill="url(#metal-claro)"
        stroke="#303532"
        stroke-width="14"
        filter="url(#textura)"
      />

      <line
        x1="256"
        y1="78"
        x2="256"
        y2="434"
        stroke="#414743"
        stroke-width="12"
      />

      <g
        fill="none"
        stroke="#505752"
        stroke-width="8"
      >
        <path
          d="M135 118 H220"
        />

        <path
          d="M135 148 H220"
        />

        <path
          d="M135 178 H220"
        />

        <path
          d="M292 118 H377"
        />

        <path
          d="M292 148 H377"
        />

        <path
          d="M292 178 H377"
        />
      </g>

      <g
        fill="#2b2f2c"
        stroke="#111311"
        stroke-width="6"
      >
        <rect
          x="215"
          y="240"
          width="23"
          height="65"
          rx="9"
        />

        <rect
          x="274"
          y="240"
          width="23"
          height="65"
          rx="9"
        />
      </g>

      <rect
        x="130"
        y="355"
        width="252"
        height="48"
        rx="8"
        fill="#666d67"
        stroke="#343936"
        stroke-width="7"
      />
    
  </g>
</svg>
