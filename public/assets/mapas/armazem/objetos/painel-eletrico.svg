<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <filter
      id="sombra"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="12"
        dy="16"
        stdDeviation="13"
        flood-color="#000000"
        flood-opacity="0.55"
      />
    </filter>

    <filter
      id="textura"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.025"
        numOctaves="3"
        seed="11"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="ruido-cinza"
      />

      <feComponentTransfer
        in="ruido-cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.16"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>

    <linearGradient
      id="metal"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#858982"
      />

      <stop
        offset="0.48"
        stop-color="#444944"
      />

      <stop
        offset="1"
        stop-color="#262a28"
      />
    </linearGradient>

    <linearGradient
      id="metal-claro"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#b9bdb4"
      />

      <stop
        offset="1"
        stop-color="#5d625d"
      />
    </linearGradient>

    <linearGradient
      id="madeira"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#bd8042"
      />

      <stop
        offset="0.5"
        stop-color="#824b27"
      />

      <stop
        offset="1"
        stop-color="#4e2c1b"
      />
    </linearGradient>

    <linearGradient
      id="amarelo"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#f3c84f"
      />

      <stop
        offset="0.55"
        stop-color="#c98d18"
      />

      <stop
        offset="1"
        stop-color="#76500c"
      />
    </linearGradient>

    <linearGradient
      id="vermelho"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#ef5448"
      />

      <stop
        offset="0.55"
        stop-color="#aa211e"
      />

      <stop
        offset="1"
        stop-color="#5a1110"
      />
    </linearGradient>
  </defs>

  <rect
    width="512"
    height="512"
    fill="transparent"
  />

  <g filter="url(#sombra)">
    
      <rect
        x="70"
        y="57"
        width="372"
        height="398"
        rx="24"
        fill="#181c1b"
        opacity="0.9"
      />

      <rect
        x="87"
        y="74"
        width="338"
        height="364"
        rx="17"
        fill="url(#metal-claro)"
        stroke="#303632"
        stroke-width="14"
        filter="url(#textura)"
      />

      <rect
        x="112"
        y="108"
        width="288"
        height="180"
        rx="10"
        fill="#303735"
        stroke="#151817"
        stroke-width="10"
      />

      <g
        fill="#0f1211"
        stroke="#606861"
        stroke-width="5"
      >
        <rect
          x="139"
          y="137"
          width="50"
          height="101"
          rx="8"
        />

        <rect
          x="208"
          y="137"
          width="50"
          height="101"
          rx="8"
        />

        <rect
          x="277"
          y="137"
          width="50"
          height="101"
          rx="8"
        />

        <rect
          x="346"
          y="137"
          width="26"
          height="101"
          rx="8"
        />
      </g>

      <g>
        <circle
          cx="154"
          cy="333"
          r="21"
          fill="#39bd5b"
          stroke="#173f21"
          stroke-width="8"
        />

        <circle
          cx="220"
          cy="333"
          r="21"
          fill="#e5b23d"
          stroke="#5a4412"
          stroke-width="8"
        />

        <circle
          cx="286"
          cy="333"
          r="21"
          fill="#d8433b"
          stroke="#561410"
          stroke-width="8"
        />
      </g>

      <path
        d="M344 316 L305 378 H339 L315 418 L391 347 H354 L383 316 Z"
        fill="#f2c334"
        stroke="#5e4810"
        stroke-width="7"
      />

      <circle
        cx="387"
        cy="101"
        r="12"
        fill="#1e211f"
      />
    
  </g>
</svg>
