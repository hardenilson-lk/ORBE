<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <linearGradient
      id="metal"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#8d918b"
      />

      <stop
        offset="0.45"
        stop-color="#515650"
      />

      <stop
        offset="1"
        stop-color="#282c29"
      />
    </linearGradient>

    <linearGradient
      id="metal-claro"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#b9bcb4"
      />

      <stop
        offset="0.5"
        stop-color="#777c75"
      />

      <stop
        offset="1"
        stop-color="#474c47"
      />
    </linearGradient>

    <linearGradient
      id="metal-escuro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#414642"
      />

      <stop
        offset="1"
        stop-color="#1e2220"
      />
    </linearGradient>

    <linearGradient
      id="porta-amarela"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#d7ae3d"
      />

      <stop
        offset="0.52"
        stop-color="#a87518"
      />

      <stop
        offset="1"
        stop-color="#5f420c"
      />
    </linearGradient>

    <linearGradient
      id="porta-vermelha"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#d84b43"
      />

      <stop
        offset="0.52"
        stop-color="#9e2622"
      />

      <stop
        offset="1"
        stop-color="#51100f"
      />
    </linearGradient>

    <pattern
      id="faixa-perigo"
      width="64"
      height="64"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)"
    >
      <rect
        width="32"
        height="64"
        fill="#d6ad35"
      />

      <rect
        x="32"
        width="32"
        height="64"
        fill="#252825"
      />
    </pattern>

    <filter
      id="sombra"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="10"
        dy="14"
        stdDeviation="11"
        flood-color="#000000"
        flood-opacity="0.6"
      />
    </filter>

    <filter
      id="textura"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.025"
        numOctaves="3"
        seed="19"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="ruido-cinza"
      />

      <feComponentTransfer
        in="ruido-cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.16"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>
  </defs>

  
        <g
          filter="url(#sombra)"
          transform="rotate(90 256 256)"
        >
          <rect
            x="18"
            y="174"
            width="476"
            height="164"
            rx="14"
            fill="#171a18"
          />

          <rect
            x="28"
            y="185"
            width="456"
            height="142"
            rx="9"
            fill="url(#metal-escuro)"
            stroke="#0d0f0e"
            stroke-width="10"
            filter="url(#textura)"
          />

          <rect
            x="44"
            y="201"
            width="424"
            height="110"
            rx="5"
            fill="url(#metal)"
            stroke="#555b55"
            stroke-width="7"
          />

          <g
            fill="#202421"
            stroke="#111311"
            stroke-width="5"
          >
            <rect
              x="67"
              y="215"
              width="72"
              height="82"
              rx="5"
            />

            <rect
              x="153"
              y="215"
              width="72"
              height="82"
              rx="5"
            />

            <rect
              x="239"
              y="215"
              width="72"
              height="82"
              rx="5"
            />

            <rect
              x="325"
              y="215"
              width="72"
              height="82"
              rx="5"
            />

            <rect
              x="411"
              y="215"
              width="34"
              height="82"
              rx="5"
            />
          </g>

          <path
            d="M42 202 H470"
            stroke="#b0b4aa"
            stroke-width="7"
            opacity="0.42"
          />

          <g
            fill="#b8b8a7"
            stroke="#242824"
            stroke-width="4"
          >
            <circle
              cx="49"
              cy="256"
              r="9"
            />

            <circle
              cx="463"
              cy="256"
              r="9"
            />

            <circle
              cx="256"
              cy="206"
              r="8"
            />

            <circle
              cx="256"
              cy="306"
              r="8"
            />
          </g>
        </g>
      
</svg>
