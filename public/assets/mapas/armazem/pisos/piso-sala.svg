<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <filter
      id="textura"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.025"
        numOctaves="4"
        seed="21"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="ruido-cinza"
      />

      <feComponentTransfer
        in="ruido-cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.24"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>

    <linearGradient
      id="concreto"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#8a887e"
      />

      <stop
        offset="0.48"
        stop-color="#74746e"
      />

      <stop
        offset="1"
        stop-color="#5f615d"
      />
    </linearGradient>

    <linearGradient
      id="concreto-escuro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#686b66"
      />

      <stop
        offset="1"
        stop-color="#444945"
      />
    </linearGradient>

    <pattern
      id="faixa-industrial"
      width="72"
      height="72"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)"
    >
      <rect
        width="36"
        height="72"
        fill="#d2a52e"
      />

      <rect
        x="36"
        width="36"
        height="72"
        fill="#292b29"
      />
    </pattern>
  </defs>

  
      <rect
        width="512"
        height="512"
        fill="url(#concreto)"
        filter="url(#textura)"
      />

      <path
        d="M0 256 H512 M256 0 V512"
        fill="none"
        stroke="#4d504c"
        stroke-width="5"
        opacity="0.42"
      />

      <path
        d="M0 6 H512 M6 0 V512"
        fill="none"
        stroke="#b1aa91"
        stroke-width="5"
        opacity="0.2"
      />

      <g
        fill="#3f423f"
        opacity="0.16"
      >
        <circle
          cx="83"
          cy="102"
          r="18"
        />

        <circle
          cx="374"
          cy="81"
          r="10"
        />

        <circle
          cx="420"
          cy="349"
          r="21"
        />

        <circle
          cx="146"
          cy="403"
          r="13"
        />

        <circle
          cx="286"
          cy="298"
          r="8"
        />
      </g>

      <g
        fill="none"
        stroke="#4a4d49"
        stroke-linecap="round"
        opacity="0.28"
      >
        <path
          d="M61 181 C127 160 165 202 222 177"
          stroke-width="7"
        />

        <path
          d="M303 415 C354 385 398 430 459 398"
          stroke-width="6"
        />

        <path
          d="M308 144 L332 168 L319 194"
          stroke-width="5"
        />
      </g>
    
</svg>
