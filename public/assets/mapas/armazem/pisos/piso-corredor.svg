<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <filter
      id="textura"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.025"
        numOctaves="4"
        seed="21"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="ruido-cinza"
      />

      <feComponentTransfer
        in="ruido-cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.24"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>

    <linearGradient
      id="concreto"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#8a887e"
      />

      <stop
        offset="0.48"
        stop-color="#74746e"
      />

      <stop
        offset="1"
        stop-color="#5f615d"
      />
    </linearGradient>

    <linearGradient
      id="concreto-escuro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#686b66"
      />

      <stop
        offset="1"
        stop-color="#444945"
      />
    </linearGradient>

    <pattern
      id="faixa-industrial"
      width="72"
      height="72"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)"
    >
      <rect
        width="36"
        height="72"
        fill="#d2a52e"
      />

      <rect
        x="36"
        width="36"
        height="72"
        fill="#292b29"
      />
    </pattern>
  </defs>

  
      <rect
        width="512"
        height="512"
        fill="url(#concreto-escuro)"
        filter="url(#textura)"
      />

      <rect
        x="0"
        y="210"
        width="512"
        height="92"
        fill="#77776d"
        opacity="0.65"
      />

      <rect
        x="0"
        y="225"
        width="512"
        height="15"
        fill="#d0a83b"
        opacity="0.82"
      />

      <rect
        x="0"
        y="272"
        width="512"
        height="15"
        fill="#d0a83b"
        opacity="0.82"
      />

      <path
        d="M0 0 H512 V512 H0 Z"
        fill="none"
        stroke="#353936"
        stroke-width="12"
        opacity="0.35"
      />

      <g
        fill="#252826"
        opacity="0.22"
      >
        <circle
          cx="94"
          cy="116"
          r="17"
        />

        <circle
          cx="411"
          cy="377"
          r="23"
        />

        <circle
          cx="271"
          cy="74"
          r="11"
        />
      </g>
    
</svg>
