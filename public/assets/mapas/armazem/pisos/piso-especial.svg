<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <filter
      id="textura"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.025"
        numOctaves="4"
        seed="21"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="ruido-cinza"
      />

      <feComponentTransfer
        in="ruido-cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.24"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>

    <linearGradient
      id="concreto"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#8a887e"
      />

      <stop
        offset="0.48"
        stop-color="#74746e"
      />

      <stop
        offset="1"
        stop-color="#5f615d"
      />
    </linearGradient>

    <linearGradient
      id="concreto-escuro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#686b66"
      />

      <stop
        offset="1"
        stop-color="#444945"
      />
    </linearGradient>

    <pattern
      id="faixa-industrial"
      width="72"
      height="72"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)"
    >
      <rect
        width="36"
        height="72"
        fill="#d2a52e"
      />

      <rect
        x="36"
        width="36"
        height="72"
        fill="#292b29"
      />
    </pattern>
  </defs>

  
      <rect
        width="512"
        height="512"
        fill="#555955"
        filter="url(#textura)"
      />

      <rect
        x="0"
        y="0"
        width="512"
        height="72"
        fill="url(#faixa-industrial)"
        opacity="0.9"
      />

      <rect
        x="0"
        y="440"
        width="512"
        height="72"
        fill="url(#faixa-industrial)"
        opacity="0.9"
      />

      <rect
        x="48"
        y="105"
        width="416"
        height="302"
        rx="18"
        fill="#777a72"
        stroke="#333633"
        stroke-width="14"
      />

      <path
        d="M96 151 H416 V361 H96 Z"
        fill="none"
        stroke="#c6a43c"
        stroke-width="10"
        stroke-dasharray="35 22"
        opacity="0.85"
      />

      <g
        fill="#292c29"
        opacity="0.3"
      >
        <circle
          cx="150"
          cy="233"
          r="20"
        />

        <circle
          cx="359"
          cy="302"
          r="15"
        />

        <circle
          cx="278"
          cy="185"
          r="9"
        />
      </g>
    
</svg>
