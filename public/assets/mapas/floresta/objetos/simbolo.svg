          />

          <circle
            cx="256"
            cy="256"
            r="137"
            fill="none"
            stroke="#bd3948"
            stroke-width="13"
            stroke-dasharray="28 15"
          />

          <path
            d="
              M256 98
              L302 199
              L413 210
              L329 282
              L355 390
              L256 333
              L157 390
              L183 282
              L99 210
              L210 199
              Z
            "
            fill="none"
            stroke="#c94b58"
            stroke-width="17"
            stroke-linejoin="round"
          />

          <circle
            cx="256"
            cy="256"
            r="37"
            fill="#40151c"
            stroke="#e06269"
            stroke-width="11"
          />

          <g
