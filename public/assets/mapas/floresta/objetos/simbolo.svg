<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <radialGradient
      id="folhagem"
      cx="42%"
      cy="36%"
      r="68%"
    >
      <stop
        offset="0"
        stop-color="#8aa45a"
      />

      <stop
        offset="0.46"
        stop-color="#4f713b"
      />

      <stop
        offset="1"
        stop-color="#263b28"
      />
    </radialGradient>

    <radialGradient
      id="folhagem-escura"
      cx="38%"
      cy="32%"
      r="70%"
    >
      <stop
        offset="0"
        stop-color="#678249"
      />

      <stop
        offset="0.52"
        stop-color="#365134"
      />

      <stop
        offset="1"
        stop-color="#17271e"
      />
    </radialGradient>

    <linearGradient
      id="madeira"
      x1="0"
