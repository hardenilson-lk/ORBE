    <radialGradient
      id="lama"
      cx="42%"
      cy="35%"
      r="70%"
    >
      <stop
        offset="0"
        stop-color="#806a48"
      />

      <stop
        offset="0.6"
        stop-color="#51462f"
      />

      <stop
        offset="1"
        stop-color="#29291f"
      />
    </radialGradient>

    <radialGradient
      id="agua"
      cx="40%"
      cy="30%"
      r="72%"
    >
      <stop
        offset="0"
        stop-color="#83b6b0"
      />

      <stop
        offset="0.5"
        stop-color="#477b78"
      />

      <stop
        offset="1"
        stop-color="#243f42"
      />
    </radialGradient>

    <filter
      id="sombra"
      x="-35%"
      y="-35%"
      width="170%"
      height="170%"
    >
      <feDropShadow
        dx="12"
        dy="16"
        stdDeviation="13"
        flood-color="#000000"
        flood-opacity="0.58"
      />
    </filter>

    <filter
      id="sombra-suave"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="7"
        dy="10"
        stdDeviation="9"
        flood-color="#000000"
        flood-opacity="0.42"
      />
    </filter>

    <filter
      id="textura"
      x="-15%"
      y="-15%"
      width="130%"
      height="130%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.025"
        numOctaves="3"
        seed="31"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="cinza"
      />

      <feComponentTransfer
        in="cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.14"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>
  </defs>

  
        <g filter="url(#sombra-suave)">
          <circle
            cx="256"
            cy="256"
            r="182"
            fill="#29251f"
            fill-opacity="0.38"
            stroke="#7e2730"
