    >
      <stop
        offset="0"
        stop-color="#bd8750"
      />

      <stop
        offset="1"
        stop-color="#684025"
      />
    </linearGradient>

    <linearGradient
      id="pedra"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#9a9b87"
      />

      <stop
        offset="0.48"
        stop-color="#666b61"
      />

      <stop
        offset="1"
        stop-color="#343936"
      />
    </linearGradient>

    <linearGradient
      id="lona"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#c7a85c"
      />

      <stop
        offset="0.52"
        stop-color="#866e35"
      />

      <stop
        offset="1"
