            stroke-linecap="round"
            opacity="0.58"
          >
            <path d="M109 239 C166 208 224 232 271 216" />
            <path d="M187 288 C249 259 313 285 377 253" />
            <path d="M121 326 C176 306 215 331 259 314" />
          </g>

          <g
