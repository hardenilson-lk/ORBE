      />
    </filter>

    <filter
      id="textura"
      x="-15%"
      y="-15%"
      width="130%"
      height="130%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.025"
        numOctaves="3"
        seed="31"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="cinza"
      />

      <feComponentTransfer
        in="cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.14"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>
