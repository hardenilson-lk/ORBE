<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <radialGradient
      id="folhagem"
      cx="42%"
      cy="36%"
      r="68%"
    >
      <stop
        offset="0"
        stop-color="#8aa45a"
      />

      <stop
        offset="0.46"
        stop-color="#4f713b"
      />

      <stop
        offset="1"
        stop-color="#263b28"
      />
    </radialGradient>

    <radialGradient
      id="folhagem-escura"
      cx="38%"
      cy="32%"
      r="70%"
    >
      <stop
        offset="0"
        stop-color="#678249"
      />

      <stop
        offset="0.52"
        stop-color="#365134"
      />

      <stop
        offset="1"
        stop-color="#17271e"
      />
    </radialGradient>

    <linearGradient
      id="madeira"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#9a6539"
      />

      <stop
        offset="0.48"
        stop-color="#694125"
      />

      <stop
        offset="1"
        stop-color="#352319"
      />
    </linearGradient>

    <linearGradient
      id="madeira-clara"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#bd8750"
      />

      <stop
        offset="1"
        stop-color="#684025"
      />
    </linearGradient>

    <linearGradient
      id="pedra"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#9a9b87"
      />

      <stop
        offset="0.48"
        stop-color="#666b61"
      />

      <stop
        offset="1"
        stop-color="#343936"
      />
    </linearGradient>

    <linearGradient
      id="lona"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#c7a85c"
      />

      <stop
        offset="0.52"
        stop-color="#866e35"
      />

      <stop
        offset="1"
        stop-color="#41391f"
      />
    </linearGradient>

    <radialGradient
      id="lama"
      cx="42%"
      cy="35%"
      r="70%"
    >
      <stop
        offset="0"
        stop-color="#806a48"
      />

      <stop
        offset="0.6"
        stop-color="#51462f"
      />

      <stop
        offset="1"
        stop-color="#29291f"
      />
    </radialGradient>

    <radialGradient
      id="agua"
      cx="40%"
      cy="30%"
      r="72%"
    >
      <stop
        offset="0"
        stop-color="#83b6b0"
      />

      <stop
        offset="0.5"
        stop-color="#477b78"
      />

      <stop
        offset="1"
        stop-color="#243f42"
      />
    </radialGradient>

    <filter
      id="sombra"
      x="-35%"
      y="-35%"
      width="170%"
      height="170%"
    >
      <feDropShadow
        dx="12"
        dy="16"
        stdDeviation="13"
        flood-color="#000000"
        flood-opacity="0.58"
      />
    </filter>

    <filter
      id="sombra-suave"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="7"
        dy="10"
        stdDeviation="9"
        flood-color="#000000"
        flood-opacity="0.42"
      />
    </filter>

    <filter
      id="textura"
      x="-15%"
      y="-15%"
      width="130%"
      height="130%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.025"
        numOctaves="3"
        seed="31"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="cinza"
      />

      <feComponentTransfer
        in="cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.14"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>
  </defs>

  
        <g filter="url(#sombra)">
          <ellipse
            cx="267"
            cy="376"
            rx="157"
            ry="45"
            fill="#111513"
            opacity="0.47"
          />

          <path
            d="
              M105 326
              L131 207
              L211 120
              L338 139
              L415 236
              L389 339
              L289 392
              L173 378
              Z
            "
            fill="url(#pedra)"
            stroke="#292f2c"
            stroke-width="15"
            filter="url(#textura)"
          />

          <path
            d="M151 220 L220 154 L330 166"
            fill="none"
            stroke="#c2c1aa"
            stroke-width="16"
            stroke-linecap="round"
            opacity="0.46"
          />

          <path
            d="M212 161 L245 249 L192 326"
            fill="none"
            stroke="#474d48"
            stroke-width="12"
            stroke-linecap="round"
          />

          <path
            d="M344 183 L309 274 L370 335"
