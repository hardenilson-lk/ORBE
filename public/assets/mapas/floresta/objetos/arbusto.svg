<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <radialGradient
      id="folhagem"
      cx="42%"
      cy="36%"
      r="68%"
    >
      <stop
        offset="0"
        stop-color="#8aa45a"
      />

      <stop
        offset="0.46"
        stop-color="#4f713b"
      />

      <stop
        offset="1"
        stop-color="#263b28"
      />
    </radialGradient>

    <radialGradient
      id="folhagem-escura"
      cx="38%"
      cy="32%"
      r="70%"
    >
      <stop
        offset="0"
        stop-color="#678249"
      />

      <stop
        offset="0.52"
        stop-color="#365134"
      />

      <stop
        offset="1"
        stop-color="#17271e"
      />
    </radialGradient>

    <linearGradient
      id="madeira"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#9a6539"
      />

      <stop
        offset="0.48"
        stop-color="#694125"
      />

      <stop
        offset="1"
        stop-color="#352319"
      />
    </linearGradient>

    <linearGradient
      id="madeira-clara"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#bd8750"
      />

      <stop
        offset="1"
        stop-color="#684025"
      />
    </linearGradient>

    <linearGradient
      id="pedra"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#9a9b87"
      />

      <stop
        offset="0.48"
        stop-color="#666b61"
      />

      <stop
        offset="1"
        stop-color="#343936"
      />
    </linearGradient>

    <linearGradient
      id="lona"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#c7a85c"
      />

      <stop
        offset="0.52"
        stop-color="#866e35"
      />

      <stop
        offset="1"
        stop-color="#41391f"
      />
    </linearGradient>

    <radialGradient
      id="lama"
      cx="42%"
      cy="35%"
      r="70%"
    >
      <stop
        offset="0"
        stop-color="#806a48"
      />

      <stop
        offset="0.6"
        stop-color="#51462f"
      />

      <stop
        offset="1"
        stop-color="#29291f"
      />
    </radialGradient>

    <radialGradient
      id="agua"
      cx="40%"
      cy="30%"
      r="72%"
    >
      <stop
        offset="0"
        stop-color="#83b6b0"
      />

      <stop
        offset="0.5"
        stop-color="#477b78"
      />

      <stop
        offset="1"
        stop-color="#243f42"
      />
    </radialGradient>

    <filter
      id="sombra"
      x="-35%"
      y="-35%"
      width="170%"
      height="170%"
    >
      <feDropShadow
        dx="12"
        dy="16"
        stdDeviation="13"
        flood-color="#000000"
        flood-opacity="0.58"
      />
    </filter>

    <filter
      id="sombra-suave"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="7"
        dy="10"
        stdDeviation="9"
        flood-color="#000000"
        flood-opacity="0.42"
      />
    </filter>

    <filter
      id="textura"
      x="-15%"
      y="-15%"
      width="130%"
      height="130%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.025"
        numOctaves="3"
        seed="31"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="cinza"
      />

      <feComponentTransfer
        in="cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.14"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>
  </defs>

  
        <g filter="url(#sombra-suave)">
          <ellipse
            cx="256"
            cy="356"
            rx="153"
            ry="38"
            fill="#101911"
            opacity="0.42"
          />

          <g
            fill="url(#folhagem-escura)"
            stroke="#1c3020"
            stroke-width="10"
          >
            <circle cx="151" cy="260" r="74" />
            <circle cx="211" cy="192" r="83" />
            <circle cx="297" cy="189" r="88" />
            <circle cx="365" cy="254" r="76" />
            <circle cx="256" cy="286" r="104" />
          </g>

          <g
            fill="#8ca15f"
            opacity="0.42"
          >
            <circle cx="195" cy="191" r="20" />
            <circle cx="287" cy="164" r="24" />
            <circle cx="348" cy="239" r="17" />
            <circle cx="236" cy="278" r="22" />
          </g>

          <path
            d="M164 334 C216 300 296 302 353 336"
            fill="none"
            stroke="#543923"
            stroke-width="17"
            stroke-linecap="round"
          />
        </g>
      
</svg>
