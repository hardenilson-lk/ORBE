<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <linearGradient
      id="metal"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#8b9692"
      />

      <stop
        offset="0.45"
        stop-color="#56615d"
      />

      <stop
        offset="1"
        stop-color="#28312e"
      />
    </linearGradient>

    <linearGradient
      id="metal-claro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#bcc4c0"
      />

      <stop
        offset="0.5"
        stop-color="#7c8782"
      />

      <stop
        offset="1"
        stop-color="#48514e"
      />
    </linearGradient>

    <linearGradient
      id="metal-escuro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#414b48"
      />

      <stop
        offset="0.5"
        stop-color="#242d2a"
      />

      <stop
        offset="1"
        stop-color="#0f1513"
      />
    </linearGradient>

    <linearGradient
      id="porta-blindada"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#798783"
      />

      <stop
        offset="0.5"
        stop-color="#45534f"
      />

      <stop
        offset="1"
        stop-color="#202a27"
      />
    </linearGradient>

    <linearGradient
      id="porta-alerta"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#d7544c"
      />

      <stop
        offset="0.5"
        stop-color="#992d2a"
      />

      <stop
        offset="1"
        stop-color="#4b1415"
      />
    </linearGradient>

    <linearGradient
      id="vidro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#d8ffff"
        stop-opacity=".9"
      />

      <stop
        offset="0.48"
        stop-color="#79b8b5"
        stop-opacity=".7"
      />

      <stop
        offset="1"
        stop-color="#2c6260"
        stop-opacity=".88"
      />
    </linearGradient>

    <radialGradient
      id="luz-verde"
      cx="50%"
      cy="50%"
      r="70%"
    >
      <stop
        offset="0"
        stop-color="#c8ffd7"
        stop-opacity="1"
      />

      <stop
        offset="0.42"
        stop-color="#4ecf73"
        stop-opacity=".78"
      />

      <stop
        offset="1"
        stop-color="#125a2b"
        stop-opacity="0"
      />
    </radialGradient>

    <radialGradient
      id="luz-vermelha"
      cx="50%"
      cy="50%"
      r="70%"
    >
      <stop
        offset="0"
        stop-color="#ffc0b3"
        stop-opacity="1"
      />

      <stop
        offset="0.42"
        stop-color="#e34d46"
        stop-opacity=".8"
      />

      <stop
        offset="1"
        stop-color="#681618"
        stop-opacity="0"
      />
    </radialGradient>

    <pattern
      id="placas-metalicas"
      width="96"
      height="96"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="96"
        height="96"
        fill="url(#metal)"
      />

      <path
        d="M0 0H96V96H0Z"
        fill="none"
        stroke="#1b2421"
        stroke-width="6"
        opacity=".8"
      />

      <path
        d="M13 13H83V83H13Z"
        fill="none"
        stroke="#7f8985"
        stroke-width="4"
        opacity=".42"
      />

      <circle
        cx="15"
        cy="15"
        r="5"
        fill="#a9b0ad"
        stroke="#252d2a"
        stroke-width="3"
      />

      <circle
        cx="81"
        cy="15"
        r="5"
        fill="#a9b0ad"
        stroke="#252d2a"
        stroke-width="3"
      />

      <circle
        cx="15"
        cy="81"
        r="5"
        fill="#a9b0ad"
        stroke="#252d2a"
        stroke-width="3"
      />

      <circle
        cx="81"
        cy="81"
        r="5"
        fill="#a9b0ad"
        stroke="#252d2a"
        stroke-width="3"
      />
    </pattern>

    <pattern
      id="faixa-perigo"
      width="72"
      height="72"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)"
    >
      <rect
        width="36"
        height="72"
        fill="#d0a52e"
      />

      <rect
        x="36"
        width="36"
        height="72"
        fill="#202624"
      />
    </pattern>

    <pattern
      id="grade"
      width="44"
      height="44"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="44"
        height="44"
        fill="#111816"
      />

      <path
        d="M11 0V44M33 0V44"
        stroke="#75817d"
        stroke-width="7"
      />

      <path
        d="M0 11H44M0 33H44"
        stroke="#56615d"
        stroke-width="4"
      />
    </pattern>

    <filter
      id="sombra"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="10"
        dy="14"
        stdDeviation="11"
        flood-color="#000000"
        flood-opacity=".68"
      />
    </filter>

    <filter
      id="textura"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".029"
        numOctaves="3"
        seed="83"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="ruido-cinza"
      />

      <feComponentTransfer
        in="ruido-cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 .16"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>
  </defs>

  
        <g filter="url(#sombra)">
          <path
            d="
              M58 72
              H302
              V210
              H440
              V454
              H276
              V236
              H58
              Z
            "
            fill="#0d1311"
          />

          <path
            d="
              M73 88
              H286
              V226
              H424
              V438
              H292
              V220
              H73
              Z
            "
            fill="url(#placas-metalicas)"
            stroke="#18211e"
            stroke-width="13"
            filter="url(#textura)"
          />

          <path
            d="M91 112H260V250H399"
            fill="none"
            stroke="#aeb7b3"
            stroke-width="18"
            opacity=".4"
          />

          <path
            d="M89 180H220V311H359V416"
            fill="none"
            stroke="url(#faixa-perigo)"
            stroke-width="44"
          />

          <path
            d="M92 173H227V304H366"
            fill="none"
            stroke="#e0bd3b"
            stroke-width="7"
            opacity=".56"
          />

          <g
            fill="#a1a9a5"
            stroke="#252d2a"
            stroke-width="5"
          >
            <circle
              cx="98"
              cy="103"
              r="9"
            />

            <circle
              cx="276"
              cy="104"
              r="9"
            />

            <circle
              cx="303"
              cy="239"
              r="9"
            />

            <circle
              cx="409"
              cy="418"
              r="9"
            />
          </g>
        </g>
      
</svg>
