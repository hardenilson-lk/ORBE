  viewBox="0 0 512 512"
  width="512"
  height="512"
  preserveAspectRatio="none"
>
  <defs>
    <filter
      id="ruido"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.73"
        numOctaves="3"
        seed="63"
        result="textura"
      />

      <feColorMatrix
        in="textura"
        type="saturate"
        values="0"
        result="texturaCinza"
      />

      <feComponentTransfer
        in="texturaCinza"
        result="texturaSuave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.16"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="texturaSuave"
        mode="soft-light"
      />
    </filter>

    <linearGradient
      id="metalSala"
      x1="0"
      y1="0"
      x2="1"
