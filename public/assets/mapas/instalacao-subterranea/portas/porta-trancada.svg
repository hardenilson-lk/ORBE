<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <linearGradient
      id="metal"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#8b9692"
      />

      <stop
        offset="0.45"
        stop-color="#56615d"
      />

      <stop
        offset="1"
        stop-color="#28312e"
      />
    </linearGradient>

    <linearGradient
      id="metal-claro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#bcc4c0"
      />

      <stop
        offset="0.5"
        stop-color="#7c8782"
      />

      <stop
        offset="1"
        stop-color="#48514e"
      />
    </linearGradient>

    <linearGradient
      id="metal-escuro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#414b48"
      />

      <stop
        offset="0.5"
        stop-color="#242d2a"
      />

      <stop
        offset="1"
        stop-color="#0f1513"
      />
    </linearGradient>

    <linearGradient
      id="porta-blindada"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#798783"
      />

      <stop
        offset="0.5"
        stop-color="#45534f"
      />

      <stop
        offset="1"
        stop-color="#202a27"
      />
    </linearGradient>

    <linearGradient
      id="porta-alerta"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#d7544c"
      />

      <stop
        offset="0.5"
        stop-color="#992d2a"
      />

      <stop
        offset="1"
        stop-color="#4b1415"
      />
    </linearGradient>

    <linearGradient
      id="vidro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#d8ffff"
        stop-opacity=".9"
      />

      <stop
        offset="0.48"
        stop-color="#79b8b5"
        stop-opacity=".7"
      />

      <stop
        offset="1"
        stop-color="#2c6260"
        stop-opacity=".88"
      />
    </linearGradient>

    <radialGradient
      id="luz-verde"
      cx="50%"
      cy="50%"
      r="70%"
    >
      <stop
        offset="0"
        stop-color="#c8ffd7"
        stop-opacity="1"
      />

      <stop
        offset="0.42"
        stop-color="#4ecf73"
        stop-opacity=".78"
      />

      <stop
        offset="1"
        stop-color="#125a2b"
        stop-opacity="0"
      />
    </radialGradient>

    <radialGradient
      id="luz-vermelha"
      cx="50%"
      cy="50%"
      r="70%"
    >
      <stop
        offset="0"
        stop-color="#ffc0b3"
        stop-opacity="1"
      />

      <stop
        offset="0.42"
        stop-color="#e34d46"
        stop-opacity=".8"
      />

      <stop
        offset="1"
        stop-color="#681618"
        stop-opacity="0"
      />
    </radialGradient>

    <pattern
      id="placas-metalicas"
      width="96"
      height="96"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="96"
        height="96"
        fill="url(#metal)"
      />

      <path
        d="M0 0H96V96H0Z"
        fill="none"
        stroke="#1b2421"
        stroke-width="6"
        opacity=".8"
      />

      <path
        d="M13 13H83V83H13Z"
        fill="none"
        stroke="#7f8985"
        stroke-width="4"
        opacity=".42"
      />

      <circle
        cx="15"
        cy="15"
        r="5"
        fill="#a9b0ad"
        stroke="#252d2a"
        stroke-width="3"
      />

      <circle
        cx="81"
        cy="15"
        r="5"
        fill="#a9b0ad"
        stroke="#252d2a"
        stroke-width="3"
      />

      <circle
        cx="15"
        cy="81"
        r="5"
        fill="#a9b0ad"
        stroke="#252d2a"
        stroke-width="3"
      />

      <circle
        cx="81"
        cy="81"
        r="5"
        fill="#a9b0ad"
        stroke="#252d2a"
        stroke-width="3"
      />
    </pattern>

    <pattern
      id="faixa-perigo"
      width="72"
      height="72"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)"
    >
      <rect
        width="36"
        height="72"
        fill="#d0a52e"
      />

      <rect
        x="36"
        width="36"
        height="72"
        fill="#202624"
      />
    </pattern>

    <pattern
      id="grade"
      width="44"
      height="44"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="44"
        height="44"
        fill="#111816"
      />

      <path
        d="M11 0V44M33 0V44"
        stroke="#75817d"
        stroke-width="7"
      />

      <path
        d="M0 11H44M0 33H44"
        stroke="#56615d"
        stroke-width="4"
      />
    </pattern>

    <filter
      id="sombra"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="10"
        dy="14"
        stdDeviation="11"
        flood-color="#000000"
        flood-opacity=".68"
      />
    </filter>

    <filter
      id="textura"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".029"
        numOctaves="3"
        seed="83"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="ruido-cinza"
      />

      <feComponentTransfer
        in="ruido-cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 .16"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>
  </defs>

  
        <g filter="url(#sombra)">
          <rect
            x="55"
            y="114"
            width="402"
            height="284"
            rx="24"
            fill="#0c1210"
          />

          <rect
            x="75"
            y="135"
            width="362"
            height="242"
            rx="15"
            fill="url(#porta-alerta)"
            stroke="#451416"
            stroke-width="16"
            filter="url(#textura)"
          />

          <rect
            x="101"
            y="159"
            width="310"
            height="72"
            rx="8"
            fill="url(#grade)"
            stroke="#1c2522"
            stroke-width="11"
          />

          <rect
            x="99"
            y="250"
            width="314"
            height="101"
            rx="9"
            fill="url(#faixa-perigo)"
            opacity=".82"
            stroke="#411416"
            stroke-width="11"
          />

          <circle
            cx="256"
            cy="295"
            r="63"
            fill="#241719"
            stroke="#aab2ae"
            stroke-width="11"
          />

          <circle
            cx="256"
            cy="295"
            r="23"
            fill="#d6c551"
            stroke="#39320f"
            stroke-width="8"
          />

          <path
            d="M256 242V268M211 318L234 304M301 318L278 304"
            stroke="#c4cbc7"
            stroke-width="11"
            stroke-linecap="round"
          />

          <path
            d="M226 259C244 240 268 240 286 259"
            fill="none"
            stroke="#c4cbc7"
            stroke-width="11"
            stroke-linecap="round"
          />

          <circle
            cx="374"
            cy="180"
            r="18"
            fill="#e04740"
            stroke="#541616"
            stroke-width="7"
          />

          <circle
            cx="374"
            cy="180"
            r="40"
            fill="url(#luz-vermelha)"
            opacity=".5"
          />

          <rect
            x="91"
            y="101"
            width="330"
            height="45"
            rx="10"
            fill="url(#metal-escuro)"
            stroke="#0c1210"
            stroke-width="9"
          />

          <rect
            x="165"
            y="107"
            width="182"
            height="32"
            rx="7"
            fill="#e0c8c7"
            stroke="#692222"
            stroke-width="5"
          />

          <path
            d="M190 123H322"
            stroke="#a42f2c"
            stroke-width="8"
            stroke-linecap="round"
          />
        </g>
      
</svg>
