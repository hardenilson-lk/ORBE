<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <linearGradient
      id="concreto"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#d0d5d4"
      />

      <stop
        offset="0.48"
        stop-color="#a3acad"
      />

      <stop
        offset="1"
        stop-color="#707a7c"
      />
    </linearGradient>

    <linearGradient
      id="concreto-escuro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#687376"
      />

      <stop
        offset="0.5"
        stop-color="#434e52"
      />

      <stop
        offset="1"
        stop-color="#252d30"
      />
    </linearGradient>

    <linearGradient
      id="faixa-azul"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#497b9b"
      />

      <stop
        offset="0.48"
        stop-color="#285879"
      />

      <stop
        offset="1"
        stop-color="#15384f"
      />
    </linearGradient>

    <linearGradient
      id="metal"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#bcc5c5"
      />

      <stop
        offset="0.46"
        stop-color="#758184"
      />

      <stop
        offset="1"
        stop-color="#3a4447"
      />
    </linearGradient>

    <linearGradient
      id="metal-escuro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#4d595d"
      />

      <stop
        offset="0.5"
        stop-color="#2d373b"
      />

      <stop
        offset="1"
        stop-color="#151b1e"
      />
    </linearGradient>

    <linearGradient
      id="porta-azul"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#477896"
      />

      <stop
        offset="0.5"
        stop-color="#285572"
      />

      <stop
        offset="1"
        stop-color="#143247"
      />
    </linearGradient>

    <linearGradient
      id="porta-vermelha"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#c94d4a"
      />

      <stop
        offset="0.52"
        stop-color="#8d2928"
      />

      <stop
        offset="1"
        stop-color="#481415"
      />
    </linearGradient>

    <linearGradient
      id="vidro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#d9eef1"
        stop-opacity=".9"
      />

      <stop
        offset="0.5"
        stop-color="#81aeb8"
        stop-opacity=".75"
      />

      <stop
        offset="1"
        stop-color="#345f6a"
        stop-opacity=".86"
      />
    </linearGradient>

    <pattern
      id="placas-metal"
      width="64"
      height="64"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="64"
        height="64"
        fill="url(#metal)"
      />

      <path
        d="M0 0H64V64H0Z"
        fill="none"
        stroke="#3d484b"
        stroke-width="4"
        opacity=".64"
      />

      <circle
        cx="9"
        cy="9"
        r="4"
        fill="#c2caca"
        stroke="#3a4345"
        stroke-width="2"
      />

      <circle
        cx="55"
        cy="55"
        r="4"
        fill="#c2caca"
        stroke="#3a4345"
        stroke-width="2"
      />
    </pattern>

    <pattern
      id="grade"
      width="42"
      height="42"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="42"
        height="42"
        fill="#161c1f"
      />

      <path
        d="M10 0V42M32 0V42"
        stroke="#839093"
        stroke-width="7"
      />

      <path
        d="M0 10H42M0 32H42"
        stroke="#687579"
        stroke-width="4"
      />
    </pattern>

    <pattern
      id="faixa-alerta"
      width="64"
      height="64"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)"
    >
      <rect
        width="32"
        height="64"
        fill="#d2ad37"
      />

      <rect
        x="32"
        width="32"
        height="64"
        fill="#252a2b"
      />
    </pattern>

    <filter
      id="sombra"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="9"
        dy="13"
        stdDeviation="10"
        flood-color="#000000"
        flood-opacity=".58"
      />
    </filter>

    <filter
      id="textura"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".028"
        numOctaves="3"
        seed="43"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="ruido-cinza"
      />

      <feComponentTransfer
        in="ruido-cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 .15"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>
  </defs>

  
        <g filter="url(#sombra)">
          <rect
            x="66"
            y="105"
            width="380"
            height="302"
            rx="22"
            fill="#252d30"
          />

          <rect
            x="89"
            y="128"
            width="334"
            height="256"
            rx="13"
            fill="#111719"
            stroke="#687477"
            stroke-width="13"
          />

          <rect
            x="94"
            y="148"
            width="95"
            height="218"
            rx="10"
            fill="url(#porta-azul)"
            stroke="#173a4f"
            stroke-width="11"
            transform="rotate(-20 94 148)"
          />

          <rect
            x="323"
            y="148"
            width="95"
            height="218"
            rx="10"
            fill="url(#porta-azul)"
            stroke="#173a4f"
            stroke-width="11"
            transform="rotate(20 418 148)"
          />

          <path
            d="M191 162H321V348H191Z"
            fill="#070a0b"
            stroke="#536064"
            stroke-width="10"
            stroke-dasharray="22 15"
          />

          <path
            d="M205 177H307V334H205Z"
            fill="#020304"
            opacity=".95"
          />

          <path
            d="M214 194H298M214 317H298"
            stroke="#678a93"
            stroke-width="7"
            opacity=".27"
          />

          <rect
            x="96"
            y="99"
            width="320"
            height="42"
            rx="9"
            fill="url(#concreto-escuro)"
            stroke="#252d30"
            stroke-width="8"
          />

          <rect
            x="179"
            y="104"
            width="154"
            height="30"
            rx="7"
            fill="#d9e2e3"
            stroke="#384b51"
            stroke-width="5"
          />

          <path
            d="M203 119H309"
            stroke="#254f68"
            stroke-width="7"
            stroke-linecap="round"
          />
        </g>
      
</svg>
