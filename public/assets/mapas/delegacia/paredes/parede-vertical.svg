<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <linearGradient
      id="concreto"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#d0d5d4"
      />

      <stop
        offset="0.48"
        stop-color="#a3acad"
      />

      <stop
        offset="1"
        stop-color="#707a7c"
      />
    </linearGradient>

    <linearGradient
      id="concreto-escuro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#687376"
      />

      <stop
        offset="0.5"
        stop-color="#434e52"
      />

      <stop
        offset="1"
        stop-color="#252d30"
      />
    </linearGradient>

    <linearGradient
      id="faixa-azul"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#497b9b"
      />

      <stop
        offset="0.48"
        stop-color="#285879"
      />

      <stop
        offset="1"
        stop-color="#15384f"
      />
    </linearGradient>

    <linearGradient
      id="metal"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#bcc5c5"
      />

      <stop
        offset="0.46"
        stop-color="#758184"
      />

      <stop
        offset="1"
        stop-color="#3a4447"
      />
    </linearGradient>

    <linearGradient
      id="metal-escuro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#4d595d"
      />

      <stop
        offset="0.5"
        stop-color="#2d373b"
      />

      <stop
        offset="1"
        stop-color="#151b1e"
      />
    </linearGradient>

    <linearGradient
      id="porta-azul"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#477896"
      />

      <stop
        offset="0.5"
        stop-color="#285572"
      />

      <stop
        offset="1"
        stop-color="#143247"
      />
    </linearGradient>

    <linearGradient
      id="porta-vermelha"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#c94d4a"
      />

      <stop
        offset="0.52"
        stop-color="#8d2928"
      />

      <stop
        offset="1"
        stop-color="#481415"
      />
    </linearGradient>

    <linearGradient
      id="vidro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#d9eef1"
        stop-opacity=".9"
      />

      <stop
        offset="0.5"
        stop-color="#81aeb8"
        stop-opacity=".75"
      />

      <stop
        offset="1"
        stop-color="#345f6a"
        stop-opacity=".86"
      />
    </linearGradient>

    <pattern
      id="placas-metal"
      width="64"
      height="64"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="64"
        height="64"
        fill="url(#metal)"
      />

      <path
        d="M0 0H64V64H0Z"
        fill="none"
        stroke="#3d484b"
        stroke-width="4"
        opacity=".64"
      />

      <circle
        cx="9"
        cy="9"
        r="4"
        fill="#c2caca"
        stroke="#3a4345"
        stroke-width="2"
      />

      <circle
        cx="55"
        cy="55"
        r="4"
        fill="#c2caca"
        stroke="#3a4345"
        stroke-width="2"
      />
    </pattern>

    <pattern
      id="grade"
      width="42"
      height="42"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="42"
        height="42"
        fill="#161c1f"
      />

      <path
        d="M10 0V42M32 0V42"
        stroke="#839093"
        stroke-width="7"
      />

      <path
        d="M0 10H42M0 32H42"
        stroke="#687579"
        stroke-width="4"
      />
    </pattern>

    <pattern
      id="faixa-alerta"
      width="64"
      height="64"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)"
    >
      <rect
        width="32"
        height="64"
        fill="#d2ad37"
      />

      <rect
        x="32"
        width="32"
        height="64"
        fill="#252a2b"
      />
    </pattern>

    <filter
      id="sombra"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="9"
        dy="13"
        stdDeviation="10"
        flood-color="#000000"
        flood-opacity=".58"
      />
    </filter>

    <filter
      id="textura"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".028"
        numOctaves="3"
        seed="43"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="ruido-cinza"
      />

      <feComponentTransfer
        in="ruido-cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 .15"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>
  </defs>

  
        <g
          filter="url(#sombra)"
          transform="rotate(90 256 256)"
        >
          <rect
            x="18"
            y="171"
            width="476"
            height="170"
            rx="14"
            fill="#252d30"
          />

          <rect
            x="29"
            y="183"
            width="454"
            height="146"
            rx="9"
            fill="url(#concreto)"
            stroke="#465154"
            stroke-width="10"
            filter="url(#textura)"
          />

          <rect
            x="43"
            y="197"
            width="426"
            height="53"
            rx="4"
            fill="#c5cbca"
            stroke="#727c7d"
            stroke-width="5"
          />

          <rect
            x="43"
            y="250"
            width="426"
            height="63"
            rx="4"
            fill="url(#faixa-azul)"
            stroke="#18384c"
            stroke-width="5"
          />

          <path
            d="M47 205H465"
            stroke="#eef2f1"
            stroke-width="7"
            opacity=".4"
          />

          <path
            d="M47 259H465"
            stroke="#88aabd"
            stroke-width="6"
            opacity=".45"
          />

          <path
            d="M73 219H168M195 219H285M312 219H437"
            stroke="#9da5a5"
            stroke-width="6"
            stroke-linecap="round"
            opacity=".43"
          />

          <path
            d="M72 288H177M205 288H283M310 288H439"
            stroke="#102f43"
            stroke-width="7"
            stroke-linecap="round"
            opacity=".5"
          />

          <g
            fill="#a1a8a6"
            stroke="#343d3f"
            stroke-width="4"
          >
            <circle
              cx="49"
              cy="256"
              r="9"
            />

            <circle
              cx="463"
              cy="256"
              r="9"
            />

            <circle
              cx="256"
              cy="193"
              r="8"
            />

            <circle
              cx="256"
              cy="319"
              r="8"
            />
          </g>
        </g>
      
</svg>
