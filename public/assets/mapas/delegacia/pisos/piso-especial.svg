<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  preserveAspectRatio="none"
>
  <defs>
    <filter
      id="ruido"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.72"
        numOctaves="3"
        seed="27"
        result="textura"
      />

      <feColorMatrix
        in="textura"
        type="saturate"
        values="0"
        result="texturaCinza"
      />

      <feComponentTransfer
        in="texturaCinza"
        result="texturaSuave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.16"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="texturaSuave"
        mode="soft-light"
      />
    </filter>

    <linearGradient
      id="baseSala"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#c6ced0"
      />

      <stop
        offset="0.48"
        stop-color="#aab5b8"
      />

      <stop
        offset="1"
        stop-color="#7d898c"
      />
    </linearGradient>

    <linearGradient
      id="baseCorredor"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#7f8d91"
      />

      <stop
        offset="0.5"
        stop-color="#5e6b70"
      />

      <stop
        offset="1"
        stop-color="#3d484c"
      />
    </linearGradient>

    <linearGradient
      id="baseEspecial"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#4f5a5e"
      />

      <stop
        offset="0.52"
        stop-color="#303a3e"
      />

      <stop
        offset="1"
        stop-color="#151b1d"
      />
    </linearGradient>

    <pattern
      id="placasSala"
      width="128"
      height="128"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="128"
        height="128"
        fill="url(#baseSala)"
      />

      <path
        d="M0 0H128V128H0Z"
        fill="none"
        stroke="#5d686b"
        stroke-width="5"
        opacity=".58"
      />

      <path
        d="M64 0V128M0 64H128"
        stroke="#dfe5e5"
        stroke-width="3"
        opacity=".22"
      />

      <circle
        cx="24"
        cy="29"
        r="3"
        fill="#5e696c"
        opacity=".27"
      />

      <circle
        cx="99"
        cy="84"
        r="4"
        fill="#536064"
        opacity=".2"
      />

      <path
        d="M13 105c28-8 52 8 76-1 13-5 23-4 29 0"
        fill="none"
        stroke="#e5e9e8"
        stroke-width="3"
        stroke-linecap="round"
        opacity=".22"
      />
    </pattern>

    <pattern
      id="faixasCorredor"
      width="128"
      height="128"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="128"
        height="128"
        fill="url(#baseCorredor)"
      />

      <path
        d="M0 0H128V128H0Z"
        fill="none"
        stroke="#283236"
        stroke-width="5"
        opacity=".7"
      />

      <rect
        x="0"
        y="54"
        width="128"
        height="20"
        fill="#c5b765"
        opacity=".5"
      />

      <path
        d="M0 64H128"
        stroke="#e3d47c"
        stroke-width="6"
        stroke-dasharray="28 13"
        opacity=".64"
      />

      <path
        d="M18 21h92M18 107h92"
        stroke="#cbd3d3"
        stroke-width="3"
        stroke-dasharray="17 10"
        opacity=".22"
      />
    </pattern>

    <pattern
      id="placasEspeciais"
      width="128"
      height="128"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="128"
        height="128"
        fill="url(#baseEspecial)"
      />

      <path
        d="M0 0H128V128H0Z"
        fill="none"
        stroke="#101719"
        stroke-width="7"
        opacity=".9"
      />

      <path
        d="M14 14H114V114H14Z"
        fill="none"
        stroke="#6c797c"
        stroke-width="4"
        opacity=".45"
      />

      <circle
        cx="18"
        cy="18"
        r="6"
        fill="#a1aaab"
        stroke="#222b2e"
        stroke-width="3"
      />

      <circle
        cx="110"
        cy="18"
        r="6"
        fill="#a1aaab"
        stroke="#222b2e"
        stroke-width="3"
      />

      <circle
        cx="18"
        cy="110"
        r="6"
        fill="#a1aaab"
        stroke="#222b2e"
        stroke-width="3"
      />

      <circle
        cx="110"
        cy="110"
        r="6"
        fill="#a1aaab"
        stroke="#222b2e"
        stroke-width="3"
      />
    </pattern>

    <pattern
      id="faixaPerigo"
      width="72"
      height="72"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(35)"
    >
      <rect
        width="36"
        height="72"
        fill="#c7a532"
      />

      <rect
        x="36"
        width="36"
        height="72"
        fill="#202628"
      />
    </pattern>
  </defs>


  <g filter="url(#ruido)">
    <rect
      width="512"
      height="512"
      fill="url(#placasEspeciais)"
    />

    <path
      d="M0 34H512"
      stroke="url(#faixaPerigo)"
      stroke-width="46"
    />

    <path
      d="M0 478H512"
      stroke="url(#faixaPerigo)"
      stroke-width="46"
    />

    <rect
      x="25"
      y="72"
      width="462"
      height="368"
      rx="12"
      fill="none"
      stroke="#859194"
      stroke-width="7"
      opacity=".48"
    />

    <rect
      x="48"
      y="95"
      width="416"
      height="322"
      rx="9"
      fill="none"
      stroke="#12191b"
      stroke-width="6"
      opacity=".72"
    />

    <circle
      cx="256"
      cy="256"
      r="108"
      fill="none"
      stroke="#a02e35"
      stroke-width="14"
      opacity=".66"
    />

    <path
      d="M178 178 334 334M334 178 178 334"
      stroke="#b53a40"
      stroke-width="13"
      stroke-linecap="round"
      opacity=".7"
    />

    <path
      d="M256 121V391M121 256H391"
      stroke="#8c989b"
      stroke-width="5"
      stroke-dasharray="25 15"
      opacity=".35"
    />
  </g>
</svg>
