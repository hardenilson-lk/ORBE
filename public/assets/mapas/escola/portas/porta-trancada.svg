<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <linearGradient
      id="reboco"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#ddd9c8"
      />

      <stop
        offset="0.5"
        stop-color="#b9b7a7"
      />

      <stop
        offset="1"
        stop-color="#858a7e"
      />
    </linearGradient>

    <linearGradient
      id="reboco-escuro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#7d857a"
      />

      <stop
        offset="0.5"
        stop-color="#565f57"
      />

      <stop
        offset="1"
        stop-color="#313833"
      />
    </linearGradient>

    <linearGradient
      id="faixa-verde"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#769388"
      />

      <stop
        offset="0.52"
        stop-color="#496b60"
      />

      <stop
        offset="1"
        stop-color="#29483f"
      />
    </linearGradient>

    <linearGradient
      id="madeira"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#bd8856"
      />

      <stop
        offset="0.45"
        stop-color="#82532f"
      />

      <stop
        offset="1"
        stop-color="#432919"
      />
    </linearGradient>

    <linearGradient
      id="madeira-clara"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#d7ac78"
      />

      <stop
        offset="0.5"
        stop-color="#a36b3d"
      />

      <stop
        offset="1"
        stop-color="#684020"
      />
    </linearGradient>

    <linearGradient
      id="metal"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#c4c8c1"
      />

      <stop
        offset="0.5"
        stop-color="#7b827c"
      />

      <stop
        offset="1"
        stop-color="#434943"
      />
    </linearGradient>

    <linearGradient
      id="porta-vermelha"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#c94d47"
      />

      <stop
        offset="0.52"
        stop-color="#922d2a"
      />

      <stop
        offset="1"
        stop-color="#4b1717"
      />
    </linearGradient>

    <linearGradient
      id="vidro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#d8eeec"
        stop-opacity=".9"
      />

      <stop
        offset="0.45"
        stop-color="#8db5b2"
        stop-opacity=".75"
      />

      <stop
        offset="1"
        stop-color="#426b69"
        stop-opacity=".82"
      />
    </linearGradient>

    <pattern
      id="azulejo"
      width="64"
      height="64"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="64"
        height="64"
        fill="#d8d8c9"
      />

      <path
        d="M0 0H64V64H0Z"
        fill="none"
        stroke="#777d74"
        stroke-width="4"
        opacity=".5"
      />

      <path
        d="M8 8H56V56H8Z"
        fill="none"
        stroke="#f1efe1"
        stroke-width="3"
        opacity=".3"
      />
    </pattern>

    <pattern
      id="faixa-alerta"
      width="64"
      height="64"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)"
    >
      <rect
        width="32"
        height="64"
        fill="#d7b73e"
      />

      <rect
        x="32"
        width="32"
        height="64"
        fill="#252825"
      />
    </pattern>

    <filter
      id="sombra"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="9"
        dy="13"
        stdDeviation="10"
        flood-color="#000000"
        flood-opacity=".55"
      />
    </filter>

    <filter
      id="textura"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".03"
        numOctaves="3"
        seed="31"
        result="ruido"
      />

      <feColorMatrix
        in="ruido"
        type="saturate"
        values="0"
        result="ruido-cinza"
      />

      <feComponentTransfer
        in="ruido-cinza"
        result="ruido-suave"
      >
        <feFuncA
          type="table"
          tableValues="0 .14"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="ruido-suave"
        mode="multiply"
      />
    </filter>
  </defs>

  
        <g filter="url(#sombra)">
          <rect
            x="61"
            y="121"
            width="390"
            height="270"
            rx="22"
            fill="#2d312e"
          />

          <rect
            x="79"
            y="140"
            width="354"
            height="232"
            rx="14"
            fill="url(#porta-vermelha)"
            stroke="#471716"
            stroke-width="15"
            filter="url(#textura)"
          />

          <rect
            x="103"
            y="165"
            width="306"
            height="64"
            rx="8"
            fill="url(#vidro)"
            stroke="#3e5654"
            stroke-width="10"
          />

          <path
            d="M179 167V227M256 167V227M333 167V227"
            stroke="#5f7370"
            stroke-width="8"
          />

          <rect
            x="100"
            y="245"
            width="312"
            height="98"
            rx="9"
            fill="url(#faixa-alerta)"
            opacity=".75"
            stroke="#451514"
            stroke-width="10"
          />

          <rect
            x="206"
            y="231"
            width="100"
            height="116"
            rx="15"
            fill="url(#metal)"
            stroke="#222723"
            stroke-width="11"
          />

          <path
            d="M226 236V204C226 160 286 160 286 204V236"
            fill="none"
            stroke="#d1d4cc"
            stroke-width="19"
            stroke-linecap="round"
          />

          <circle
            cx="256"
            cy="282"
            r="16"
            fill="#d6c65e"
            stroke="#322d10"
            stroke-width="7"
          />

          <path
            d="M256 298V322"
            stroke="#25271f"
            stroke-width="10"
            stroke-linecap="round"
          />

          <rect
            x="96"
            y="108"
            width="320"
            height="40"
            rx="9"
            fill="url(#reboco-escuro)"
            stroke="#292e2a"
            stroke-width="8"
          />

          <rect
            x="187"
            y="112"
            width="138"
            height="30"
            rx="7"
            fill="#ead8d4"
            stroke="#692b28"
            stroke-width="5"
          />
        </g>
      
</svg>
