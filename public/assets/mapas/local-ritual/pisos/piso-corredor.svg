<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  preserveAspectRatio="none"
>
  <defs>
    <filter
      id="ruido"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.68"
        numOctaves="3"
        seed="79"
        result="textura"
      />

      <feColorMatrix
        in="textura"
        type="saturate"
        values="0"
        result="texturaCinza"
      />

      <feComponentTransfer
        in="texturaCinza"
        result="texturaSuave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.19"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="texturaSuave"
        mode="soft-light"
      />
    </filter>

    <filter
      id="brilho"
      x="-35%"
      y="-35%"
      width="170%"
      height="170%"
    >
      <feGaussianBlur
        stdDeviation="9"
        result="desfoque"
      />

      <feMerge>
        <feMergeNode
          in="desfoque"
        />

        <feMergeNode
          in="SourceGraphic"
        />
      </feMerge>
    </filter>

    <linearGradient
      id="concretoSala"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#5b5555"
      />

      <stop
        offset="0.48"
        stop-color="#393435"
      />

      <stop
        offset="1"
        stop-color="#1c191b"
      />
    </linearGradient>

    <linearGradient
      id="concretoCorredor"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#3f3a3d"
      />

      <stop
        offset="0.5"
        stop-color="#262125"
      />

      <stop
        offset="1"
        stop-color="#100d10"
      />
    </linearGradient>

    <linearGradient
      id="pisoRitual"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#291a29"
      />

      <stop
        offset="0.5"
        stop-color="#170f1a"
      />

      <stop
        offset="1"
        stop-color="#070609"
      />
    </linearGradient>

    <radialGradient
      id="energiaRoxa"
      cx="50%"
      cy="50%"
      r="68%"
    >
      <stop
        offset="0"
        stop-color="#f5b6ff"
        stop-opacity=".92"
      />

      <stop
        offset="0.27"
        stop-color="#bd5ce8"
        stop-opacity=".76"
      />

      <stop
        offset="0.58"
        stop-color="#652184"
        stop-opacity=".42"
      />

      <stop
        offset="1"
        stop-color="#17091f"
        stop-opacity="0"
      />
    </radialGradient>

    <radialGradient
      id="energiaVermelha"
      cx="50%"
      cy="50%"
      r="68%"
    >
      <stop
        offset="0"
        stop-color="#ff9f9b"
        stop-opacity=".9"
      />

      <stop
        offset="0.35"
        stop-color="#d33b51"
        stop-opacity=".65"
      />

      <stop
        offset="1"
        stop-color="#55101f"
        stop-opacity="0"
      />
    </radialGradient>

    <pattern
      id="placasSala"
      width="128"
      height="128"
      patternUnits="userSpaceOnUse"
    >
