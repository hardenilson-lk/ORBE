        width="128"
        height="128"
        fill="url(#concretoSala)"
      />

      <path
        d="M0 0H128V128H0Z"
        fill="none"
        stroke="#171416"
        stroke-width="7"
        opacity=".82"
      />

      <path
        d="M15 15H113V113H15Z"
        fill="none"
        stroke="#746d6d"
        stroke-width="4"
        opacity=".34"
      />

      <path
        d="M64 15V113M15 64H113"
        stroke="#857d7d"
        stroke-width="3"
        opacity=".18"
      />

      <circle
        cx="18"
        cy="18"
        r="6"
        fill="#918989"
        stroke="#302b2d"
        stroke-width="3"
      />

      <circle
        cx="110"
        cy="18"
        r="6"
        fill="#918989"
        stroke="#302b2d"
        stroke-width="3"
      />

      <circle
        cx="18"
        cy="110"
        r="6"
        fill="#918989"
        stroke="#302b2d"
        stroke-width="3"
      />

      <circle
        cx="110"
        cy="110"
        r="6"
        fill="#918989"
        stroke="#302b2d"
        stroke-width="3"
      />

      <path
        d="M21 94c23-11 43 8 63-2 13-6 23-5 30 0"
        fill="none"
        stroke="#9f9697"
        stroke-width="3"
        stroke-linecap="round"
        opacity=".17"
      />
    </pattern>

    <pattern
      id="placasCorredor"
      width="128"
      height="128"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="128"
        height="128"
        fill="url(#concretoCorredor)"
      />

      <path
        d="M0 0H128V128H0Z"
        fill="none"
        stroke="#080709"
        stroke-width="7"
        opacity=".94"
      />

      <path
        d="M14 14H114V114H14Z"
        fill="none"
        stroke="#4d464b"
        stroke-width="4"
        opacity=".48"
      />

      <rect
        x="0"
        y="52"
        width="128"
        height="24"
        fill="#5c1e39"
        opacity=".48"
      />

      <path
        d="M0 64H128"
        stroke="#b23d68"
        stroke-width="7"
        stroke-dasharray="30 15"
        opacity=".7"
      />

      <path
        d="M18 27h92M18 101h92"
        stroke="#786d73"
        stroke-width="3"
        stroke-dasharray="18 11"
        opacity=".2"
      />

      <circle
        cx="18"
        cy="18"
        r="5"
        fill="#70686c"
      />

      <circle
        cx="110"
        cy="110"
        r="5"
        fill="#70686c"
      />
    </pattern>

    <pattern
      id="placasEspeciais"
      width="128"
      height="128"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="128"
        height="128"
        fill="url(#pisoRitual)"
      />

      <path
        d="M0 0H128V128H0Z"
        fill="none"
        stroke="#030204"
        stroke-width="8"
        opacity=".98"
      />

      <path
        d="M15 15H113V113H15Z"
        fill="none"
        stroke="#47264f"
        stroke-width="4"
        opacity=".58"
      />

      <path
        d="M64 15V113M15 64H113"
        stroke="#34183d"
        stroke-width="4"
        opacity=".52"
      />

      <circle
        cx="18"
        cy="18"
        r="6"
        fill="#814394"
        stroke="#170a1c"
        stroke-width="3"
      />

      <circle
        cx="110"
        cy="18"
        r="6"
        fill="#814394"
        stroke="#170a1c"
        stroke-width="3"
      />

      <circle
        cx="18"
        cy="110"
        r="6"
        fill="#814394"
        stroke="#170a1c"
        stroke-width="3"
      />

      <circle
        cx="110"
        cy="110"
        r="6"
        fill="#814394"
        stroke="#170a1c"
        stroke-width="3"
      />
    </pattern>

    <pattern
      id="faixaPerigo"
      width="72"
      height="72"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(35)"
    >
      <rect
        width="36"
        height="72"
        fill="#8e2b4d"
      />

      <rect
        x="36"
        width="36"
        height="72"
        fill="#171016"
      />
    </pattern>
  </defs>


  <g filter="url(#ruido)">
    <rect
      width="512"
      height="512"
      fill="url(#placasCorredor)"
    />

    <path
      d="M0 128H512M0 256H512M0 384H512"
      stroke="#080709"
      stroke-width="6"
      opacity=".8"
    />

    <path
      d="M0 64H512M0 320H512"
      stroke="#a73660"
      stroke-width="10"
      stroke-dasharray="42 19"
      opacity=".64"
    />

    <path
      d="M19 19H493V493H19Z"
      fill="none"
      stroke="#635960"
      stroke-width="6"
      opacity=".27"
    />

    <path
      d="M48 104h416M48 408h416"
      stroke="#887880"
      stroke-width="4"
      stroke-dasharray="20 12"
      opacity=".22"
    />

    <path
      d="M256 0V512"
      stroke="#d85080"
      stroke-width="5"
      stroke-dasharray="24 16"
      opacity=".32"
    />

    <g
      fill="#050405"
      opacity=".42"
    >
      <circle
        cx="86"
        cy="183"
        r="8"
      />

      <circle
        cx="406"
        cy="343"
        r="7"
      />

      <circle
        cx="281"
        cy="461"
        r="6"
      />
    </g>
  </g>
</svg>
