  <defs>
    <filter
      id="ruido"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.68"
        numOctaves="3"
        seed="79"
        result="textura"
      />

      <feColorMatrix
        in="textura"
        type="saturate"
        values="0"
        result="texturaCinza"
      />

      <feComponentTransfer
        in="texturaCinza"
        result="texturaSuave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.19"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="texturaSuave"
        mode="soft-light"
      />
    </filter>

    <filter
      id="brilho"
      x="-35%"
      y="-35%"
      width="170%"
      height="170%"
    >
      <feGaussianBlur
        stdDeviation="9"
        result="desfoque"
      />

      <feMerge>
        <feMergeNode
          in="desfoque"
        />

        <feMergeNode
          in="SourceGraphic"
        />
      </feMerge>
    </filter>

