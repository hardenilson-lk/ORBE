<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <filter
      id="sombra"
      x="-35%"
      y="-35%"
      width="170%"
      height="170%"
    >
      <feDropShadow
        dx="0"
        dy="13"
        stdDeviation="12"
        flood-color="#000000"
        flood-opacity="0.48"
      />
    </filter>

    <filter
      id="sombraLeve"
      x="-25%"
      y="-25%"
      width="150%"
      height="150%"
    >
      <feDropShadow
        dx="0"
        dy="7"
        stdDeviation="7"
        flood-color="#000000"
        flood-opacity="0.36"
      />
    </filter>

    <linearGradient
      id="metal"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#d5d8d5"
      />

      <stop
        offset="0.35"
        stop-color="#7b8581"
      />

      <stop
        offset="0.7"
        stop-color="#404946"
      />

      <stop
        offset="1"
        stop-color="#171c1b"
      />
    </linearGradient>

    <linearGradient
      id="metalEscuro"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#505956"
      />

      <stop
        offset="0.5"
        stop-color="#292f2d"
      />

      <stop
        offset="1"
        stop-color="#101312"
      />
    </linearGradient>

    <linearGradient
      id="madeiraEscura"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#755038"
      />

      <stop
        offset="0.45"
        stop-color="#42291f"
      />

      <stop
        offset="1"
        stop-color="#1c1310"
      />
    </linearGradient>

    <linearGradient
      id="tecido"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#5f243c"
      />

      <stop
        offset="0.5"
        stop-color="#361627"
      />

      <stop
        offset="1"
        stop-color="#160d14"
      />
    </linearGradient>

    <linearGradient
      id="papel"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#eee3bd"
      />

      <stop
        offset="0.55"
        stop-color="#c5b282"
      />

      <stop
        offset="1"
        stop-color="#88724f"
      />
    </linearGradient>

    <linearGradient
      id="vidro"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#d9eff0"
        stop-opacity=".8"
      />

      <stop
        offset="0.48"
        stop-color="#698d8e"
        stop-opacity=".62"
      />

      <stop
        offset="1"
        stop-color="#263f41"
        stop-opacity=".82"
      />
    </linearGradient>

    <radialGradient
      id="luzVela"
      cx="50%"
      cy="38%"
      r="64%"
    >
      <stop
        offset="0"
        stop-color="#fffbd0"
      />

      <stop
        offset="0.28"
        stop-color="#ffd45f"
      />

      <stop
        offset="0.66"
        stop-color="#ef6b25"
      />

      <stop
        offset="1"
        stop-color="#8d1e20"
      />
    </radialGradient>

    <radialGradient
      id="energia"
      cx="50%"
      cy="45%"
      r="60%"
    >
      <stop
        offset="0"
        stop-color="#f7b9ff"
      />

      <stop
        offset="0.32"
        stop-color="#b85aff"
      />

      <stop
        offset="0.67"
        stop-color="#6120a4"
      />

      <stop
        offset="1"
        stop-color="#1a0d2d"
      />
    </radialGradient>

    <radialGradient
      id="sangue"
      cx="42%"
      cy="35%"
      r="74%"
    >
      <stop
        offset="0"
        stop-color="#b42635"
      />

      <stop
        offset="0.55"
        stop-color="#711625"
      />

      <stop
        offset="1"
        stop-color="#270b10"
      />
    </radialGradient>

    <pattern
      id="perigo"
      width="72"
      height="72"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(35)"
    >
      <rect
        width="36"
        height="72"
        fill="#d0a529"
      />

      <rect
        x="36"
        width="36"
        height="72"
        fill="#202321"
      />
    </pattern>
  </defs>


  <g filter="url(#sombraLeve)">
    <g
      fill="none"
      stroke="url(#metal)"
      stroke-width="28"
    >
      <ellipse
        cx="105"
        cy="160"
        rx="55"
        ry="88"
        transform="rotate(-38 105 160)"
      />

      <ellipse
        cx="180"
        cy="229"
        rx="55"
        ry="88"
        transform="rotate(44 180 229)"
      />

      <ellipse
        cx="256"
        cy="292"
        rx="55"
        ry="88"
        transform="rotate(-38 256 292)"
      />

      <ellipse
        cx="333"
        cy="355"
        rx="55"
        ry="88"
        transform="rotate(44 333 355)"
      />

      <ellipse
        cx="412"
        cy="409"
        rx="51"
        ry="79"
        transform="rotate(-38 412 409)"
      />
    </g>

    <g
      fill="none"
      stroke="#d6dcd7"
      stroke-width="6"
      opacity=".55"
    >
      <ellipse
        cx="105"
        cy="160"
        rx="55"
        ry="88"
        transform="rotate(-38 105 160)"
      />

      <ellipse
        cx="256"
        cy="292"
        rx="55"
        ry="88"
        transform="rotate(-38 256 292)"
      />

      <ellipse
        cx="412"
        cy="409"
        rx="51"
        ry="79"
        transform="rotate(-38 412 409)"
      />
    </g>
  </g>
</svg>
