              H286
              V226
              H424
              V438
              H292
              V220
              H73
              Z
            "
            fill="url(#ornamento)"
            stroke="#4b2e1c"
            stroke-width="13"
            filter="url(#textura)"
          />

          <path
            d="M91 112H260V250H399"
            fill="none"
            stroke="#cdbd95"
            stroke-width="18"
            opacity=".43"
          />

          <path
            d="M89 180H220V311H359V416"
            fill="none"
            stroke="url(#madeira)"
            stroke-width="44"
          />

          <path
            d="M92 173H227V304H366"
            fill="none"
            stroke="url(#ouro)"
            stroke-width="7"
            opacity=".7"
          />

          <g
