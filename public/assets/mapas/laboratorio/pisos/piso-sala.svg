<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  preserveAspectRatio="none"
>
  <defs>
    <filter
      id="ruido"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.76"
        numOctaves="3"
        seed="39"
        result="textura"
      />

      <feColorMatrix
        in="textura"
        type="saturate"
        values="0"
        result="texturaCinza"
      />

      <feComponentTransfer
        in="texturaCinza"
        result="texturaSuave"
      >
        <feFuncA
          type="table"
          tableValues="0 0.13"
        />
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="texturaSuave"
        mode="soft-light"
      />
    </filter>

    <linearGradient
      id="baseSala"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#dce4df"
      />

      <stop
        offset="0.48"
        stop-color="#bbc9c3"
      />

      <stop
        offset="1"
        stop-color="#81918b"
      />
    </linearGradient>

    <linearGradient
      id="baseCorredor"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#91a8a5"
      />

      <stop
        offset="0.5"
        stop-color="#607976"
      />

      <stop
        offset="1"
        stop-color="#344b49"
      />
    </linearGradient>

    <linearGradient
      id="baseEspecial"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#263f42"
      />

      <stop
        offset="0.48"
        stop-color="#182d30"
      />

      <stop
        offset="1"
        stop-color="#091416"
      />
    </linearGradient>

    <radialGradient
      id="energiaAzul"
      cx="50%"
      cy="50%"
      r="68%"
    >
      <stop
        offset="0"
        stop-color="#ddffff"
        stop-opacity=".95"
      />

      <stop
        offset="0.35"
        stop-color="#64dfe0"
        stop-opacity=".72"
      />

      <stop
